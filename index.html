<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TranscreveTube</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 25px 15px;
    background: #0b1120;
    color: #f1f5f9;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 750px;
    margin: 40px auto;
    padding: 28px;
    background: #151f32;
    border: 1px solid #26364f;
    border-radius: 18px;
}

h1 {
    text-align: center;
    color: #38bdf8;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #a8b5c7;
    margin-bottom: 30px;
}

input {
    width: 100%;
    padding: 15px;
    border-radius: 9px;
    border: 1px solid #42536d;
    background: #0b1120;
    color: white;
    font-size: 16px;
    margin-bottom: 15px;
}

button {
    padding: 13px 18px;
    border: none;
    border-radius: 9px;
    cursor: pointer;
    font-size: 15px;
    font-weight: bold;
}

.primary {
    width: 100%;
    background: #0284c7;
    color: white;
}

.primary:disabled {
    opacity: .5;
    cursor: wait;
}

#status {
    text-align: center;
    margin: 18px 0;
    color: #fbbf24;
}

#result {
    display: none;
    margin-top: 25px;
}

#language {
    color: #38bdf8;
    margin-bottom: 12px;
}

textarea {
    width: 100%;
    min-height: 350px;
    resize: vertical;
    padding: 15px;
    border-radius: 9px;
    border: 1px solid #42536d;
    background: #0b1120;
    color: white;
    font-size: 15px;
    line-height: 1.6;
}

.actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 15px;
}

.actions button {
    flex: 1;
    min-width: 130px;
}

.copy {
    background: #334155;
    color: white;
}

.pdf {
    background: #dc2626;
    color: white;
}

.word {
    background: #2563eb;
    color: white;
}

#error {
    display: none;
    padding: 14px;
    background: #451a1a;
    color: #fecaca;
    border-radius: 9px;
    margin-top: 15px;
}

footer {
    text-align: center;
    color: #64748b;
    margin-top: 25px;
    font-size: 12px;
}

@media(max-width: 500px) {
    .container {
        padding: 20px;
        margin-top: 15px;
    }

    .actions {
        flex-direction: column;
    }

    .actions button {
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>TranscreveTube</h1>

    <p class="subtitle">
        Transcreva legendas públicas de vídeos do YouTube.
    </p>

    <input
        type="text"
        id="videoUrl"
        placeholder="Cole aqui o link do YouTube"
    >

    <button
        class="primary"
        id="transcribeBtn"
        onclick="transcribe()"
    >
        Transcrever
    </button>

    <div id="status"></div>

    <div id="error"></div>

    <div id="result">

        <div id="language"></div>

        <textarea id="transcript" readonly></textarea>

        <div class="actions">

            <button class="copy" onclick="copyText()">
                Copiar texto
            </button>

            <button class="pdf" onclick="downloadFile('pdf')">
                Baixar PDF
            </button>

            <button class="word" onclick="downloadFile('docx')">
                Baixar Word
            </button>

        </div>

    </div>

    <footer>
        TranscreveTube
    </footer>

</div>

<script>

let currentTranscript = "";

function extractVideoId(url) {

    try {

        const parsed = new URL(url);

        if (parsed.hostname === "youtu.be") {
            return parsed.pathname.substring(1).split("/")[0];
        }

        if (
            parsed.hostname === "youtube.com" ||
            parsed.hostname.endsWith(".youtube.com")
        ) {

            if (parsed.pathname === "/watch") {
                return parsed.searchParams.get("v");
            }

            const match = parsed.pathname.match(
                /^\/(?:shorts|embed|live)\/([A-Za-z0-9_-]{11})/
            );

            return match ? match[1] : null;
        }

    } catch (e) {

        if (/^[A-Za-z0-9_-]{11}$/.test(url)) {
            return url;
        }

    }

    return null;
}

async function transcribe() {

    const input = document.getElementById("videoUrl").value.trim();

    const videoId = extractVideoId(input);

    const button = document.getElementById("transcribeBtn");
    const status = document.getElementById("status");
    const error = document.getElementById("error");
    const result = document.getElementById("result");

    error.style.display = "none";
    result.style.display = "none";

    if (!videoId) {
        showError("Insira um link válido do YouTube.");
        return;
    }

    button.disabled = true;
    status.textContent = "Buscando legendas...";

    try {

        const response = await fetch("/api/transcribe", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                videoId: videoId
            })

        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Não foi possível obter a transcrição.");
        }

        currentTranscript = data.text;

        document.getElementById("transcript").value = currentTranscript;

        document.getElementById("language").textContent =
            data.language
                ? "Idioma da legenda: " + data.language
                : "Transcrição disponível";

        result.style.display = "block";
        status.textContent = "Transcrição concluída!";

    } catch (err) {

        showError(err.message);
        status.textContent = "";

    } finally {

        button.disabled = false;

    }
}

function showError(message) {

    const error = document.getElementById("error");

    error.textContent = message;
    error.style.display = "block";

}

async function copyText() {

    if (!currentTranscript) return;

    try {

        await navigator.clipboard.writeText(currentTranscript);

    } catch (e) {

        const textarea = document.getElementById("transcript");

        textarea.select();
        document.execCommand("copy");

    }

    document.getElementById("status").textContent =
        "Texto copiado com sucesso!";

}

async function downloadFile(format) {

    if (!currentTranscript) {
        showError("Primeiro faça uma transcrição.");
        return;
    }

    const status = document.getElementById("status");

    status.textContent = "Preparando arquivo...";

    try {

        const response = await fetch("/api/download/" + format, {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                text: currentTranscript
            })

        });

        if (!response.ok) {

            const data = await response.json();

            throw new Error(data.error || "Erro ao gerar arquivo.");

        }

        const blob = await response.blob();

        const url = URL.createObjectURL(blob);

        const link = document.createElement("a");

        link.href = url;

        link.download = format === "pdf"
            ? "transcricao-youtube.pdf"
            : "transcricao-youtube.docx";

        document.body.appendChild(link);

        link.click();

        link.remove();

        URL.revokeObjectURL(url);

        status.textContent = "Arquivo baixado com sucesso!";

    } catch (err) {

        showError(err.message);
        status.textContent = "";

    }

}

</script>

</body>
</html>
